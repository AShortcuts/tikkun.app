name: Build PR preview artifact

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Fork code runs in this workflow, so the token is deliberately read-only and
# the result is an artifact rather than a privileged deployment.
permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build preview artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Use pinned npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        env:
          TIKKUN_BASE_PATH: "/pr-preview/pr-${{ github.event.pull_request.number }}"
          TIKKUN_PREVIEW_BROWSER_CHANNEL: chrome
        run: npm run build && npm run preview:verify

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: dist
          if-no-files-found: error
          retention-days: 7
