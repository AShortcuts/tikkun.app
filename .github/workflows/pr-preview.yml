name: Build PR preview artifact

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Fork code runs in this workflow, so the token is deliberately read-only and
# the result is an artifact rather than a privileged deployment.
permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build preview artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: |
          npx --no-install vite build --base "/pr-preview/pr-${{ github.event.pull_request.number }}/"
          node scripts/generate-service-worker.mjs

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: dist
          if-no-files-found: error
          retention-days: 7
