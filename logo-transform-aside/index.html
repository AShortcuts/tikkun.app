<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tikkun Transform Aside</title>
    <style>
      :root {
        --t: 0;
        --open: 0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f4f0e8;
        color: #211b12;
        font-family: Optima, Candara, "Avenir Next", sans-serif;
      }

      .stage {
        display: grid;
        gap: 18px;
        justify-items: center;
        padding: 18px;
      }

      .icon {
        width: min(82vmin, 780px);
        aspect-ratio: 1;
        border-radius: 21%;
        background:
          radial-gradient(circle at 51% 47%, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0) 31%),
          linear-gradient(145deg, #fffdf6 0%, #fff8e8 58%, #f5ead4 100%);
        box-shadow:
          0 28px 70px rgba(46, 39, 25, 0.17),
          0 7px 20px rgba(46, 39, 25, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.8),
          inset 0 -20px 40px rgba(218, 196, 151, 0.18);
        overflow: hidden;
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .book-shadow {
        opacity: calc(var(--open) * 0.12);
      }

      .page,
      .book-line,
      .spine,
      .ray {
        transition: none;
      }

      .spine {
        filter: drop-shadow(0 8px 10px rgba(137, 95, 20, 0.18));
      }

      .ray {
        opacity: calc(var(--open) * 0.56);
      }

      .mark {
        fill: #17191b;
        font-family: "Arial Hebrew", "Noto Sans Hebrew", "Arial Black", sans-serif;
        font-size: 535px;
        font-weight: 900;
        filter: drop-shadow(0 12px 14px rgba(21, 21, 19, 0.16));
        transform-box: fill-box;
        transform-origin: center;
        transform:
          translateY(calc(var(--open) * -34px))
          scale(calc(1 + var(--open) * 0.018));
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 14px;
        width: min(82vmin, 780px);
      }

      button {
        min-width: 90px;
        min-height: 40px;
        border: 1px solid rgba(115, 88, 37, 0.2);
        border-radius: 999px;
        background: rgba(255, 250, 239, 0.82);
        box-shadow: 0 8px 20px rgba(64, 49, 23, 0.08);
        color: #2c2215;
        cursor: pointer;
        font: 700 14px/1 Optima, Candara, "Avenir Next", sans-serif;
      }

      input {
        flex: 1;
        accent-color: #b98518;
      }

      @media (max-width: 640px) {
        .icon,
        .controls {
          width: min(94vmin, 780px);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="icon" aria-label="Tikkun mark transforming into an open book">
        <svg viewBox="0 0 1000 1000" role="img">
          <defs>
            <linearGradient id="goldBar" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#f4cf70" />
              <stop offset="0.55" stop-color="#e8bc4f" />
              <stop offset="1" stop-color="#c9972f" />
            </linearGradient>
            <linearGradient id="paperLeft" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#fff9eb" />
              <stop offset="0.62" stop-color="#f3ead5" />
              <stop offset="1" stop-color="#e7d7b8" />
            </linearGradient>
            <linearGradient id="paperRight" x1="1" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#fff9eb" />
              <stop offset="0.62" stop-color="#f3ead5" />
              <stop offset="1" stop-color="#e7d7b8" />
            </linearGradient>
            <linearGradient id="rayGold" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#e9bb49" stop-opacity="0.98" />
              <stop offset="1" stop-color="#e9bb49" stop-opacity="0" />
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#6b552a" flood-opacity="0.18" />
            </filter>
          </defs>

          <ellipse class="book-shadow" cx="500" cy="765" rx="310" ry="74" fill="#3f321c" />

          <g filter="url(#softShadow)">
            <path
              id="leftPage"
              class="page"
              d=""
              fill="url(#paperLeft)"
            />
            <path
              id="rightPage"
              class="page"
              d=""
              fill="url(#paperRight)"
            />
            <path id="leftTopLine" class="book-line" d="" fill="none" stroke="#d7aa41" stroke-width="5" stroke-linecap="round" />
            <path id="rightTopLine" class="book-line" d="" fill="none" stroke="#d7aa41" stroke-width="5" stroke-linecap="round" />
            <path id="leftRule1" class="book-line" d="" fill="none" stroke="#dfcfaa" stroke-width="4" stroke-linecap="round" />
            <path id="leftRule2" class="book-line" d="" fill="none" stroke="#dfcfaa" stroke-width="4" stroke-linecap="round" />
            <path id="rightRule1" class="book-line" d="" fill="none" stroke="#dfcfaa" stroke-width="4" stroke-linecap="round" />
            <path id="rightRule2" class="book-line" d="" fill="none" stroke="#dfcfaa" stroke-width="4" stroke-linecap="round" />
            <path id="spine" class="spine" d="" fill="url(#goldBar)" />
          </g>

          <path id="ray" class="ray" d="" fill="url(#rayGold)" />

          <text
            class="mark"
            x="500"
            y="500"
            direction="rtl"
            dominant-baseline="middle"
            text-anchor="middle"
          >ת</text>
        </svg>
      </div>

      <div class="controls">
        <button id="toggle" type="button">Pause</button>
        <input id="timeline" type="range" min="0" max="1000" value="0" aria-label="Animation timeline" />
      </div>
    </main>

    <script>
      const root = document.documentElement
      const timeline = document.querySelector("#timeline")
      const toggle = document.querySelector("#toggle")
      const leftPage = document.querySelector("#leftPage")
      const rightPage = document.querySelector("#rightPage")
      const leftTopLine = document.querySelector("#leftTopLine")
      const rightTopLine = document.querySelector("#rightTopLine")
      const leftRule1 = document.querySelector("#leftRule1")
      const leftRule2 = document.querySelector("#leftRule2")
      const rightRule1 = document.querySelector("#rightRule1")
      const rightRule2 = document.querySelector("#rightRule2")
      const spine = document.querySelector("#spine")
      const ray = document.querySelector("#ray")
      const duration = 5200
      let playing = true
      let startedAt = performance.now()
      let pausedProgress = 0

      const clamp01 = (value) => Math.min(1, Math.max(0, value))
      const smooth = (value) => {
        const t = clamp01(value)
        return t * t * (3 - 2 * t)
      }
      const segment = (progress, start, end) => smooth((progress - start) / (end - start))
      const mix = (from, to, value) => from + (to - from) * value
      const mixColor = (from, to, value) => {
        const mixed = from.map((channel, index) => Math.round(mix(channel, to[index], value)))
        return `rgb(${mixed[0]} ${mixed[1]} ${mixed[2]})`
      }

      function setMorphingBook(open) {
        const y = mix(500, 760, open)
        const centerY = mix(525, 878, open)
        const leftOuterX = mix(120, -8, open)
        const rightOuterX = mix(880, 1008, open)
        const leftInnerX = mix(500, 500, open)
        const rightInnerX = mix(500, 500, open)
        const thickness = mix(50, 236, open)
        const bottomY = mix(538, 1000, open)
        const pageLift = mix(0, -40, open)

        leftPage.setAttribute(
          "d",
          `M ${leftOuterX} ${y}
           C ${mix(250, 120, open)} ${mix(500, 720, open)} ${mix(390, 286, open)} ${mix(500, 710, open)} ${mix(500, 395, open)} ${mix(500, 735, open)}
           C ${mix(500, 455, open)} ${mix(538, 750, open)} ${mix(500, 491, open)} ${mix(538, 789, open)} ${leftInnerX} ${centerY}
           L ${leftInnerX} ${bottomY}
           L ${mix(120, 205, open)} ${bottomY}
           C ${mix(120, 87, open)} ${bottomY} ${leftOuterX} ${mix(538, 905, open)} ${leftOuterX} ${mix(538, 787, open)}
           Z`,
        )
        leftPage.setAttribute("fill", mixColor([232, 188, 79], [246, 237, 216], open))

        rightPage.setAttribute(
          "d",
          `M ${rightOuterX} ${y}
           C ${mix(750, 880, open)} ${mix(500, 720, open)} ${mix(610, 714, open)} ${mix(500, 710, open)} ${mix(500, 605, open)} ${mix(500, 735, open)}
           C ${mix(500, 545, open)} ${mix(538, 750, open)} ${mix(500, 509, open)} ${mix(538, 789, open)} ${rightInnerX} ${centerY}
           L ${rightInnerX} ${bottomY}
           L ${mix(880, 795, open)} ${bottomY}
           C ${mix(880, 913, open)} ${bottomY} ${rightOuterX} ${mix(538, 905, open)} ${rightOuterX} ${mix(538, 787, open)}
           Z`,
        )
        rightPage.setAttribute("fill", mixColor([232, 188, 79], [246, 237, 216], open))

        const topOpacity = Math.min(1, open * 1.8)
        leftTopLine.style.opacity = topOpacity
        rightTopLine.style.opacity = topOpacity
        leftTopLine.setAttribute("d", `M ${leftOuterX} ${y + pageLift} C 145 719 294 712 398 736 C 451 748 486 782 500 856`)
        rightTopLine.setAttribute("d", `M ${rightOuterX} ${y + pageLift} C 855 719 706 712 602 736 C 549 748 514 782 500 856`)

        const ruleOpacity = Math.max(0, (open - 0.38) / 0.62) * 0.58
        for (const rule of [leftRule1, leftRule2, rightRule1, rightRule2]) {
          rule.style.opacity = ruleOpacity
        }
        leftRule1.setAttribute("d", `M ${mix(170, 109, open)} ${mix(516, 828, open)} L ${mix(390, 375, open)} ${mix(516, 758, open)}`)
        leftRule2.setAttribute("d", `M ${mix(165, 84, open)} ${mix(528, 891, open)} L ${mix(405, 390, open)} ${mix(528, 795, open)}`)
        rightRule1.setAttribute("d", `M ${mix(830, 891, open)} ${mix(516, 828, open)} L ${mix(610, 625, open)} ${mix(516, 758, open)}`)
        rightRule2.setAttribute("d", `M ${mix(835, 916, open)} ${mix(528, 891, open)} L ${mix(595, 610, open)} ${mix(528, 795, open)}`)

        spine.setAttribute(
          "d",
          `M ${mix(491, 491, open)} ${mix(488, 690, open)}
           Q 500 ${mix(476, 676, open)} ${mix(509, 509, open)} ${mix(488, 690, open)}
           L ${mix(509, 509, open)} ${bottomY}
           L ${mix(491, 491, open)} ${bottomY}
           Z`,
        )

        ray.setAttribute("d", `M ${mix(464, 464, open)} ${mix(488, 386, open)} L ${mix(536, 536, open)} ${mix(488, 386, open)} L ${mix(506, 506, open)} ${mix(538, 678, open)} L ${mix(494, 494, open)} ${mix(538, 678, open)} Z`)
      }

      function draw(progress) {
        const open = segment(progress, 0.08, 0.78)

        root.style.setProperty("--t", progress.toFixed(4))
        root.style.setProperty("--open", open.toFixed(4))
        setMorphingBook(open)
        timeline.value = Math.round(progress * 1000)
      }

      function tick(now) {
        if (!playing) return
        const progress = Math.min((now - startedAt) / duration, 1)
        pausedProgress = progress
        draw(progress)

        if (progress < 1) {
          requestAnimationFrame(tick)
        } else {
          playing = false
          toggle.textContent = "Replay"
        }
      }

      toggle.addEventListener("click", () => {
        if (playing) {
          playing = false
          toggle.textContent = "Play"
          return
        }

        if (pausedProgress >= 1) pausedProgress = 0
        playing = true
        toggle.textContent = "Pause"
        startedAt = performance.now() - pausedProgress * duration
        requestAnimationFrame(tick)
      })

      timeline.addEventListener("input", () => {
        pausedProgress = Number(timeline.value) / 1000
        playing = false
        toggle.textContent = pausedProgress >= 1 ? "Replay" : "Play"
        draw(pausedProgress)
      })

      draw(0)
      requestAnimationFrame(tick)
    </script>
  </body>
</html>
