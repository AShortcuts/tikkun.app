<!doctype html>
<html lang="en" data-reader-theme="automatic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
    <meta name="application-name" content="Tikkun" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tikkun" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico?v=outlined-3" sizes="48x48" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg?v=outlined-3"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/assets/images/apple-touch-icon.png"
    />
    <link
      rel="mask-icon"
      href="%sveltekit.assets%/assets/images/safari-pinned-tab.svg"
      color="#000000"
    />
    %sveltekit.head%
    <script>
      ;(() => {
        const storageKey = 'tikkun.reader-preferences'
        const validThemes = new Set([
          'automatic',
          'light',
          'sepia',
          'dark',
          'custom',
        ])
        const validColor = /^#[0-9a-f]{6}$/i
        const defaultCustomBackground = '#eee6d6'
        const defaultCustomText = '#3b3026'

        const luminance = (color) => {
          const channels = [1, 3, 5].map((offset) => {
            const value = Number.parseInt(color.slice(offset, offset + 2), 16) / 255
            return value <= 0.04045
              ? value / 12.92
              : ((value + 0.055) / 1.055) ** 2.4
          })
          return 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2]
        }

        try {
          const raw = window.localStorage.getItem(storageKey)
          const preferences = JSON.parse(raw ?? 'null')
          document.documentElement.dataset.readerReducedMotion =
            preferences?.reducedMotion === 'on' || preferences?.reducedMotion === 'off'
              ? preferences.reducedMotion : 'automatic'
          const themeMode = preferences?.themeMode
          const savedThemes = []
          const candidates = Array.isArray(preferences?.savedThemes)
            ? preferences.savedThemes
            : [{ id: 'custom-theme-1', background: '#e5e5e5', text: '#191c22' }]
          for (const theme of candidates) {
            if (!theme || typeof theme !== 'object' || Array.isArray(theme)
              || typeof theme.id !== 'string' || !theme.id.trim()
              || savedThemes.some((saved) => saved.id === theme.id)
              || typeof theme.background !== 'string' || !validColor.test(theme.background)
              || typeof theme.text !== 'string' || !validColor.test(theme.text)) continue
            savedThemes.push(theme)
            if (savedThemes.length === 5) break
          }
          const savedTheme = savedThemes.find((theme) => theme.id === preferences?.activeSavedThemeId)
          const customBackground = validColor.test(
            savedTheme?.background ?? preferences?.customBackgroundColor
          )
            ? savedTheme?.background ?? preferences.customBackgroundColor
            : defaultCustomBackground
          const customText = validColor.test(savedTheme?.text ?? preferences?.customTextColor)
            ? savedTheme?.text ?? preferences.customTextColor
            : defaultCustomText
          document.documentElement.style.setProperty(
            '--reader-custom-background-color',
            customBackground
          )
          document.documentElement.style.setProperty(
            '--reader-custom-text-color',
            customText
          )
          // Match customThemeInterfaceColors before the app can hydrate.
          const backgroundLuminance = luminance(customBackground)
          const darkInk = (backgroundLuminance + 0.05) / 0.05 >= 1.05 / (backgroundLuminance + 0.05)
          const tintedInk = (weight) => {
            const color = '#' + [1, 3, 5].map((offset) =>
              Math.round(Number.parseInt(customBackground.slice(offset, offset + 2), 16) * (1 - weight)
                + (darkInk ? 0 : 255) * weight).toString(16).padStart(2, '0')
            ).join('')
            const inkLuminance = luminance(color)
            const contrast = (Math.max(backgroundLuminance, inkLuminance) + 0.05)
              / (Math.min(backgroundLuminance, inkLuminance) + 0.05)
            return contrast >= 4.5 ? color : darkInk ? '#000000' : '#ffffff'
          }
          document.documentElement.style.setProperty('--reader-custom-ui-text-color', tintedInk(0.9))
          document.documentElement.style.setProperty('--reader-custom-ui-secondary-color', tintedInk(0.72))
          if (validThemes.has(themeMode)) {
            document.documentElement.dataset.readerTheme = themeMode
            if (themeMode === 'custom') {
              document.documentElement.style.colorScheme =
                darkInk ? 'light' : 'dark'
              document.documentElement.dataset.readerCustomScheme =
                document.documentElement.style.colorScheme
            }
          }
        } catch {
          document.documentElement.dataset.readerTheme = 'automatic'
        }
        const themeColor = document.getElementById('reader-theme-color')
        if (themeColor) {
          themeColor.content = getComputedStyle(document.documentElement)
            .getPropertyValue('--paper-color').trim()
        }
      })()
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
