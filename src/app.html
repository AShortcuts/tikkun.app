<!doctype html>
<html lang="en" data-reader-theme="automatic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="application-name" content="Tikkun" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tikkun" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/assets/images/android-chrome-192x192.png"
      sizes="192x192"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/assets/images/apple-touch-icon.png"
    />
    <link
      rel="mask-icon"
      href="%sveltekit.assets%/assets/images/safari-pinned-tab.svg"
      color="#000000"
    />
    <script>
      ;(() => {
        const storageKey = 'tikkun.reader-preferences.v3'
        const validThemes = new Set(['automatic', 'light', 'sepia', 'dark'])
        const raw = window.localStorage.getItem(storageKey)
        if (!raw) return

        try {
          const themeMode = JSON.parse(raw)?.themeMode
          if (validThemes.has(themeMode)) {
            document.documentElement.dataset.readerTheme = themeMode
          }
        } catch {
          document.documentElement.dataset.readerTheme = 'automatic'
        }
      })()
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
