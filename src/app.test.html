<!doctype html>
<html lang="en" data-reader-theme="automatic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      if (window.parent !== window) {
        // Real app frames use native imports. Keep their promises in this frame
        // so removing an iframe cannot reject an import owned by the test runner.
        globalThis.__vitest_browser_runner__ = {
          wrapDynamicImport: (load) => load(),
        }
      }
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
