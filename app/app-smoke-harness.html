<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tikkun smoke harness</title>
  </head>
  <body>
    <script>
      ;(async () => {
        globalThis.__vitest_browser_runner__ =
          parent.__vitest_browser_runner__

        const response = await fetch('/index.html')
        if (!response.ok) {
          throw new Error(
            `Application document request failed with ${response.status}`
          )
        }

        const scriptClose = '</' + 'script>'
        const entryScript =
          '<script type="module" src="/app/index.ts">' + scriptClose
        const html = await response.text()
        if (!html.includes(entryScript)) {
          throw new Error(
            'Application document is missing its module entry point'
          )
        }

        const browserRunnerBridge =
          '<script>globalThis.__vitest_browser_runner__ = ' +
          'parent.__vitest_browser_runner__' +
          scriptClose
        document.open()
        document.write(
          html.replace(entryScript, browserRunnerBridge + entryScript)
        )
        document.close()
      })().catch((error) => {
        const message = document.createElement('pre')
        message.dataset.appSmokeError = 'true'
        message.textContent =
          error instanceof Error ? error.stack : String(error)
        document.body.replaceChildren(message)
      })
    </script>
  </body>
</html>
