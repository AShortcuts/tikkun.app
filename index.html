<!DOCTYPE html>
<html data-reader-theme="automatic">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Practice torah reading using this online tikkun." />
  <meta name="application-name" content="Tikkun" />
  <meta name="theme-color" content="oklch(98.5% 0 0)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tikkun" />
  <title>Tikkun.app</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/assets/images/android-chrome-192x192.png" sizes="192x192" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
  <link rel="mask-icon" href="/assets/images/safari-pinned-tab.svg" color="#000000" />
  <link rel="preload" href="/assets/fonts/NotoSansHebrew-Variable.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/assets/fonts/ShlomosemiStam.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="/css/master.css" />
  <script>
    ; (() => {
      const storageKey = 'tikkun.reader-preferences.v3'
      const defaultTheme = 'automatic'
      const validThemes = new Set(['automatic', 'light', 'sepia', 'dark'])
      const raw = window.localStorage.getItem(storageKey)
      if (!raw) return

      try {
        const parsed = JSON.parse(raw)
        const themeMode = parsed?.themeMode
        if (validThemes.has(themeMode)) {
          document.documentElement.dataset.readerTheme = themeMode
        }
      } catch {
        document.documentElement.dataset.readerTheme = defaultTheme
      }
    })()
  </script>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: oklch(98.5% 0 0);
      color-scheme: light;
      overflow: hidden;
    }

    .u-hidden {
      display: none !important;
    }

    html[data-reader-theme='dark'],
    html[data-reader-theme='dark'] body {
      background: oklch(25% 0 0);
      color-scheme: dark;
    }

    html[data-reader-theme='sepia'],
    html[data-reader-theme='sepia'] body {
      background: oklch(90% 17% 90deg);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {

      html[data-reader-theme='automatic'],
      html[data-reader-theme='automatic'] body {
        background: oklch(25% 0 0);
        color-scheme: dark;
      }
    }
  </style>
</head>

<body>
  <div class="app" data-target-id="app-root">
    <div data-target-id="reader-shell-anchor" hidden></div>
    <div data-target-id="cue-authoring-panel-root"></div>
    <div data-target-id="command-palette-root"></div>
    <div data-target-id="recording-issue-dialog-root"></div>
    <div class="reader-issue-toast u-hidden" data-target-id="reader-issue-toast" role="status" aria-live="polite"></div>
    <div class="reader-issue-toast u-hidden" data-target-id="persistence-toast" role="status" aria-live="polite"></div>
    <div data-target-id="cue-authoring-export-sheet-root"></div>
    <audio data-target-id="reader-audio"></audio>
    <div id="debug" class="u-hidden">
      <button type="button" data-target-id="debug-focal-measure-toggle">Toggle focal measure</button>
    </div>
    <div class="app-offline-prompt u-hidden" data-target-id="app-offline-prompt" role="status" aria-live="polite">
      <span>No Internet Access. Recordings can't be played.</span>
      <button class="app-update-dismiss" data-target-id="app-offline-dismiss" type="button"
        aria-label="Dismiss no internet prompt">OK</button>
    </div>
    <div class="app-update-prompt u-hidden" data-target-id="app-update-prompt" role="status" aria-live="polite">
      <span>Update available</span>
      <button class="app-update-button" data-target-id="app-update-apply" type="button">Reload</button>
      <button class="app-update-dismiss" data-target-id="app-update-dismiss" type="button"
        aria-label="Dismiss update prompt">Later</button>
    </div>
  </div>
  <script type="module" src="/app/index.ts"></script>
  <script>
      ; (() => {
        if (!('serviceWorker' in navigator)) return

        const updatePrompt = document.querySelector('[data-target-id="app-update-prompt"]')
        const applyUpdate = document.querySelector('[data-target-id="app-update-apply"]')
        const dismissUpdate = document.querySelector('[data-target-id="app-update-dismiss"]')
        let waitingWorker = null
        let hasDismissedUpdate = false
        let isReloadingForUpdate = false
        let lastUpdateCheck = 0

        const showUpdatePrompt = (worker) => {
          waitingWorker = worker
          if (hasDismissedUpdate || !updatePrompt) return
          updatePrompt.classList.remove('u-hidden')
        }

        const watchInstallingWorker = (worker) => {
          if (!worker) return
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdatePrompt(worker)
            }
          })
        }

        applyUpdate?.addEventListener('click', () => {
          if (!waitingWorker) return
          isReloadingForUpdate = true
          waitingWorker.postMessage({ type: 'SKIP_WAITING' })
        })

        dismissUpdate?.addEventListener('click', () => {
          hasDismissedUpdate = true
          updatePrompt?.classList.add('u-hidden')
        })

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (isReloadingForUpdate) window.location.reload()
        })

        window.addEventListener('load', async () => {
          try {
            const response = await fetch('/service-worker.js', {
              cache: 'no-store',
              method: 'HEAD',
            })
            const contentType = response.headers.get('content-type') ?? ''
            if (!response.ok || !/(?:java|ecma)script/i.test(contentType)) return

            const registration = await navigator.serviceWorker.register('/service-worker.js')
            if (registration.waiting) showUpdatePrompt(registration.waiting)
            watchInstallingWorker(registration.installing)
            registration.addEventListener('updatefound', () =>
              watchInstallingWorker(registration.installing)
            )

            if (navigator.serviceWorker.controller) {
              lastUpdateCheck = Date.now()
              await registration.update()
            }

            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState !== 'visible') return
              if (Date.now() - lastUpdateCheck < 60 * 60 * 1000) return
              lastUpdateCheck = Date.now()
              void registration.update()
            })
          } catch {
            // Development servers do not generate the production service worker.
          }
        })
      })()
  </script>
</body>

</html>
