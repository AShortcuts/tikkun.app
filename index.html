<!DOCTYPE html>
<html>

<head>
  <!-- Global site tag (gtag.js) - Google Analytics -->

        ? 'G-LHD6GSE2LN'

      document.querySelector('head').appendChild(script)
    })()
  </script>
  <script>
    window.dataLayer = window.dataLayer || []
    function gtag() {
      dataLayer.push(arguments)
    }
    gtag('js', new Date())

    gtag(
      'config',
      window.location.href.includes('localhost')
        ? 'G-LHD6GSE2LN'

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Practice torah reading using this online tikkun." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="tikkun.io" />

  <link rel="icon" type="image/png" href="/assets/images/android-chrome-192x192.png" sizes="192x192" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
  <link rel="mask-icon" href="/assets/images/safari-pinned-tab.svg" color="#000000" />

  <title>tikkun.io</title>
</head>

<body>
  <div class="app">
    <header class="app-toolbar">
      <div class="toolbar-content u-page-wrap">
        <div class="toolbar-wrapper mod-left">
          <div class="toolbar-item">
            <button class="toolbar-button" data-target-id="about-link" type="button">
              About
            </button>
          </div>
        </div>
        <div class="toolbar-wrapper mod-center">
          <div class="toolbar-item">
            <button class="parsha-title" data-target-id="parsha-title" data-tooltip='Tip: Press "/" to open quickly'>
              בראשית
            </button>
          </div>
        </div>
        <div class="toolbar-wrapper mod-right">
          <div class="toolbar-item">
            <button class="toolbar-button" data-target-id="settings-toggle" type="button" title="Reader settings">
              Settings
            </button>
          </div>
        </div>
      </div>
    </header>
    <div id="js-app" class="app-body">
      <section class="reader-shell" data-target-id="reader-shell">
        <div class="reader-side mod-left">
          <div class="floating-player u-hidden" data-target-id="floating-player">
            <button class="floating-player-button" data-target-id="floating-prev" type="button" title="Previous cue" aria-label="Previous cue"></button>
            <button class="floating-player-button" data-target-id="floating-play" type="button" title="Play or pause" aria-label="Play or pause"></button>
            <button class="floating-player-button" data-target-id="floating-next" type="button" title="Next cue" aria-label="Next cue"></button>
            <button class="floating-player-button" data-target-id="floating-replay" type="button" title="Replay current cue" aria-label="Replay current cue"></button>
            <a class="floating-player-button mod-download" data-target-id="floating-download" href="#" download title="Download current recording" aria-label="Download current recording"></a>
          </div>
        </div>

        <div class="reader-main" style="direction: rtl">
          <div class="tikkun-book mod-annotations-on" data-target-id="tikkun-book"></div>
          <div class="" data-target-id="parsha-picker"></div>
        </div>

        <div class="reader-side mod-right">
          <div class="reader-progress" data-target-id="reader-progress">
            <div class="reader-progress-label" data-target-id="reader-progress-label">—</div>
            <div class="reader-progress-rail">
              <div class="reader-progress-fill" data-target-id="reader-progress-fill"></div>
            </div>
            <div class="reader-progress-percent" data-target-id="reader-progress-percent">0%</div>
          </div>
        </div>
      </section>

      <section class="about-route u-hidden" data-target-id="about-view"></section>
    </div>
    <div class="reader-corner-controls">
      <button class="annotations-toggle" data-test-id="annotations-toggle"
        data-tooltip='Tip: Hold "Shift" to toggle quickly' data-tooltip-position="top-left">
        <label class="toggle">
          <div class="shadowed-circle">
            <input data-target-id="annotations-toggle" type="checkbox" checked />
            <span class="toggle-state mod-off">א</span>
            <span class="toggle-state mod-on">אֶ֨</span>
          </div>
        </label>
      </button>
    </div>
    <aside class="settings-pane u-hidden" data-target-id="settings-pane">
      <div class="settings-pane-header">
        <h2>Reader Settings</h2>
        <div class="settings-pane-header-actions">
          <button class="toolbar-button mod-icon-label" type="button" data-target-id="settings-reset-highlight">
            <span>Reset Defaults</span>
          </button>
          <button class="toolbar-button" type="button" data-target-id="settings-close">Close</button>
        </div>
      </div>
      <form class="settings-form stack medium" data-target-id="settings-form">
        <label class="settings-field">
          <span>Narrator</span>
          <select data-target-id="settings-narrator"></select>
        </label>
        <div class="settings-field">
          <span>Theme</span>
          <div class="settings-segmented-control" data-target-id="settings-theme-mode">
            <button class="settings-segmented-option" type="button" data-theme-mode="light">Light</button>
            <button class="settings-segmented-option" type="button" data-theme-mode="dark">Dark</button>
            <button class="settings-segmented-option" type="button" data-theme-mode="automatic">Automatic</button>
          </div>
        </div>
        <label class="settings-field">
          <span>Playback rate</span>
          <div class="settings-number-input">
            <input data-target-id="settings-playback-rate" type="number" min="0.5" max="2" step="0.05" inputmode="decimal" />
            <span>x</span>
          </div>
        </label>
        <label class="settings-field">
          <span>Highlight fill</span>
          <input data-target-id="settings-highlight-fill" type="color" />
        </label>
        <label class="settings-field">
          <span>Highlight opacity</span>
          <div class="settings-range-input">
            <input data-target-id="settings-highlight-opacity" type="range" min="0.05" max="0.45" step="0.01" />
            <input data-target-id="settings-highlight-opacity-value" type="number" min="0.05" max="0.45" step="0.01" inputmode="decimal" />
          </div>
        </label>
        <label class="settings-field">
          <span>Outline color</span>
          <input data-target-id="settings-outline-color" type="color" />
        </label>
        <label class="settings-field">
          <span>Outline width</span>
          <div class="settings-range-input">
            <input data-target-id="settings-outline-width" type="range" min="1" max="6" step="1" />
            <input data-target-id="settings-outline-width-value" type="number" min="1" max="6" step="1" inputmode="decimal" />
          </div>
        </label>
        <label class="settings-field">
          <span>Corner radius</span>
          <div class="settings-range-input">
            <input data-target-id="settings-radius" type="range" min="0" max="16" step="1" />
            <input data-target-id="settings-radius-value" type="number" min="0" max="16" step="1" inputmode="decimal" />
          </div>
        </label>
        <label class="settings-field">
          <span>Glow</span>
          <div class="settings-range-input">
            <input data-target-id="settings-glow" type="range" min="0" max="8" step="0.5" />
            <input data-target-id="settings-glow-value" type="number" min="0" max="8" step="0.5" inputmode="decimal" />
          </div>
        </label>
        <label class="settings-field mod-checkbox">
          <input data-target-id="settings-auto-scroll" type="checkbox" />
          <span>Auto-scroll with playback</span>
        </label>
      </form>
    </aside>
    <aside class="admin-panel u-hidden" data-target-id="admin-panel">
      <div class="admin-panel-header">
        <strong>Admin Cue Mode</strong>
        <span data-target-id="admin-cue-count">0 cues</span>
      </div>
      <div class="admin-panel-actions">
        <button type="button" class="toolbar-button" data-target-id="admin-record">Record/Edit Cues</button>
        <button type="button" class="toolbar-button" data-target-id="admin-step-back">Step Back</button>
        <button type="button" class="toolbar-button" data-target-id="admin-undo">Undo Last</button>
        <button type="button" class="toolbar-button" data-target-id="admin-reset">Reset</button>
        <button type="button" class="toolbar-button" data-target-id="admin-export">Export</button>
      </div>
    </aside>
    <div class="export-modal u-hidden" data-target-id="export-modal">
      <div class="export-card stack small">
        <div class="settings-pane-header">
          <h2>Export Cues</h2>
          <button class="toolbar-button" type="button" data-target-id="export-close">Close</button>
        </div>
        <textarea data-target-id="export-text" spellcheck="false"></textarea>
      </div>
    </div>
    <audio data-target-id="reader-audio"></audio>
    <div id="debug" class="u-hidden">
    </div>
  </div>
  <script type="module" src="/src/index.ts"></script>
</body>

</html>
