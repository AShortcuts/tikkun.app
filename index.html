<!DOCTYPE html>
<html data-reader-theme="automatic">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Practice torah reading using this online tikkun." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tikkun.app" />
  <title>Tikkun.app</title>
  <link rel="icon" type="image/png" href="/assets/images/android-chrome-192x192.png" sizes="192x192" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
  <link rel="mask-icon" href="/assets/images/safari-pinned-tab.svg" color="#000000" />
  <link rel="stylesheet" href="/css/master.css" />
  <script>
    ;(() => {
      const storageKey = 'tikkun.reader-preferences.v3'
      const defaultTheme = 'automatic'
      const validThemes = new Set(['automatic', 'light', 'sepia', 'dark'])
      const raw = window.localStorage.getItem(storageKey)
      if (!raw) return

      try {
        const parsed = JSON.parse(raw)
        const themeMode = parsed?.themeMode
        if (validThemes.has(themeMode)) {
          document.documentElement.dataset.readerTheme = themeMode
        }
      } catch {
        document.documentElement.dataset.readerTheme = defaultTheme
      }
    })()
  </script>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: oklch(98.5% 0 0);
      color-scheme: light;
      overflow: hidden;
    }

    .u-hidden {
      display: none !important;
    }

    html[data-reader-theme='dark'],
    html[data-reader-theme='dark'] body {
      background: oklch(25% 0 0);
      color-scheme: dark;
    }

    html[data-reader-theme='sepia'],
    html[data-reader-theme='sepia'] body {
      background: oklch(90% 17% 90deg);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      html[data-reader-theme='automatic'],
      html[data-reader-theme='automatic'] body {
        background: oklch(25% 0 0);
        color-scheme: dark;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="app-toolbar">
      <div class="toolbar-content u-page-wrap">
        <div class="toolbar-wrapper mod-left">
          <div class="toolbar-item">
            <button class="toolbar-button" data-target-id="about-link" type="button">
              About
            </button>
          </div>
        </div>
        <div class="toolbar-wrapper mod-center">
          <div class="toolbar-item">
            <button class="parsha-title" data-target-id="parsha-title" data-tooltip='Tip: Press "/" to open quickly'>
              בראשית
            </button>
          </div>
        </div>
        <div class="toolbar-wrapper mod-right">
          <div class="toolbar-item">
            <span class="toolbar-current-aliyah-label u-hidden" data-target-id="toolbar-current-aliyah-label">—</span>
            <button class="aliyah-audio-button toolbar-current-aliyah-audio u-hidden" data-target-id="toolbar-current-aliyah-audio" type="button" aria-label="Play current aliyah" title="Play current aliyah"></button>
            <button class="toolbar-button" data-target-id="settings-toggle" type="button" title="Reader settings" aria-label="Reader settings"></button>
          </div>
        </div>
      </div>
      
    </header>
    <div class="reader-progress-mobile" data-target-id="reader-progress-mobile" aria-hidden="true">
        <div class="reader-progress-mobile-fill" data-target-id="reader-progress-mobile-fill"></div>
      </div>
    <div id="js-app" class="app-body">
      <section class="reader-shell" data-target-id="reader-shell">
        <div class="reader-side mod-left">
          <div class="floating-player u-hidden" data-target-id="floating-player">
            <button class="floating-player-mobile-dash" data-target-id="floating-mobile-toggle" type="button" title="Play or pause" aria-label="Play or pause"></button>
            <div class="floating-player-details" data-target-id="floating-player-details">
              <div class="floating-player-meta" data-target-id="floating-player-meta">
                <span class="floating-player-meta-item">
                  <span class="floating-player-meta-label">Parsha</span>
                  <span class="floating-player-meta-value" data-target-id="floating-meta-parsha">—</span>
                </span>
                <span class="floating-player-meta-item">
                  <span class="floating-player-meta-label">Aliyah</span>
                  <span class="floating-player-meta-value" data-target-id="floating-meta-aliyah">—</span>
                </span>
              </div>
              <div class="floating-player-progress-list">
                <div class="floating-player-progress-item">
                  <div class="floating-player-progress-head">
                    <span class="floating-player-progress-label">Word Progress</span>
                    <span class="floating-player-progress-value" data-target-id="floating-meta-cues">0/0</span>
                  </div>
                  <div class="floating-player-progress-track">
                    <div class="floating-player-progress-fill mod-cues"></div>
                  </div>
                </div>
                <div class="floating-player-progress-item">
                  <div class="floating-player-progress-head">
                    <span class="floating-player-progress-label">Audio Progress</span>
                    <span class="floating-player-progress-value" data-target-id="floating-meta-duration">0:00/0:00</span>
                  </div>
                  <div class="floating-player-progress-track">
                    <div class="floating-player-progress-fill mod-audio"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="floating-player-controls">
              <button class="floating-player-button" data-target-id="floating-replay" type="button" title="Replay current Word" aria-label="Replay current Word"></button>
              <button class="floating-player-button" data-target-id="floating-next" type="button" title="Next Word" aria-label="Next Word"></button>
              <button class="floating-player-button" data-target-id="floating-play" type="button" title="Play or pause" aria-label="Play or pause"></button>
              <button class="floating-player-button" data-target-id="floating-prev" type="button" title="Previous Word" aria-label="Previous Word"></button>
              <a class="floating-player-button mod-download" data-target-id="floating-download" href="#" download title="Download current recording" aria-label="Download current recording"></a>
              <a class="floating-player-button mod-download u-hidden" data-target-id="floating-video-download" href="#" download title="Download aliyah video" aria-label="Download aliyah video"></a>
            </div>
          </div>
        </div>

        <div class="reader-main" style="direction: rtl">
          <div class="tikkun-book mod-annotations-on" data-target-id="tikkun-book" tabindex="-1"></div>
          <div class="" data-target-id="parsha-picker"></div>
        </div>

        <div class="reader-side mod-right">
          <div class="reader-progress" data-target-id="reader-progress">
            <div class="reader-progress-label" data-target-id="reader-progress-label">—</div>
            <div class="reader-progress-rail">
              <div class="reader-progress-fill" data-target-id="reader-progress-fill"></div>
            </div>
            <div class="reader-progress-percent" data-target-id="reader-progress-percent">0%</div>
          </div>
        </div>
      </section>
      <section class="about-route u-hidden" data-target-id="about-view"></section>
    </div>
    <div class="reader-corner-controls">
      <button class="annotations-toggle" data-test-id="annotations-toggle"
        data-tooltip='Tip: Hold "Shift" to toggle quickly' data-tooltip-position="top-left">
        <label class="toggle">
          <div class="shadowed-circle">
            <input data-target-id="annotations-toggle" type="checkbox" checked />
            <span class="toggle-state mod-off">א</span>
            <span class="toggle-state mod-on">אֶ֨</span>
          </div>
        </label>
      </button>
    </div>
    <aside class="settings-pane u-hidden" data-target-id="settings-pane">
      <div class="settings-pane-header">
        <h2>Reader Settings</h2>
        <div class="settings-pane-header-actions">
          <button class="toolbar-button mod-icon-label" type="button" data-target-id="settings-reset-highlight" aria-label="Reset highlight settings" title="Reset highlight settings"></button>
          <button class="toolbar-button mod-icon-label" type="button" data-target-id="settings-close" aria-label="Close reader settings" title="Close reader settings"><svg class="ui-icon lucide lucide-x-icon lucide-x" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
        </div>
      </div>
      <form class="settings-form stack medium" data-target-id="settings-form">
        <label class="settings-field">
          <span>Ba'al Koreh</span>
          <select data-target-id="settings-narrator"></select>
        </label>
        <div class="settings-field">
          <span>Theme</span>
          <div class="settings-segmented-control" data-target-id="settings-theme-mode">
            <button class="settings-segmented-option" type="button" data-theme-mode="automatic">Automatic</button>
            <button class="settings-segmented-option" type="button" data-theme-mode="light">Light</button>
            <button class="settings-segmented-option" type="button" data-theme-mode="sepia">Sepia</button>
            <button class="settings-segmented-option" type="button" data-theme-mode="dark">Dark</button>
          </div>
        </div>
        <label class="settings-field mod-inline-compact">
          <span>Playback rate</span>
          <div class="settings-number-input">
            <input data-target-id="settings-playback-rate" type="number" min="0.5" max="2" step="0.05" inputmode="decimal" />
            <span>x</span>
          </div>
        </label>
        <label class="settings-field mod-inline-compact">
          <span>Highlight fill</span>
          <input data-target-id="settings-highlight-fill" type="color" />
        </label>
        <label class="settings-field">
          <span>Highlight opacity</span>
          <div class="settings-range-input">
            <input data-target-id="settings-highlight-opacity" type="range" min="0.05" max="0.45" step="0.01" />
            <input data-target-id="settings-highlight-opacity-value" type="number" min="0.05" max="0.45" step="0.01" inputmode="decimal" />
          </div>
        </label>
        <label class="settings-field mod-inline-compact">
          <span>Outline color</span>
          <input data-target-id="settings-outline-color" type="color" />
        </label>
        <label class="settings-field">
          <span>Outline width</span>
          <div class="settings-range-input">
            <input data-target-id="settings-outline-width" type="range" min="1" max="6" step="1" />
            <input data-target-id="settings-outline-width-value" type="number" min="1" max="6" step="1" inputmode="decimal" />
          </div>
        </label>
        <label class="settings-field">
          <span>Spacing around word</span>
          <div class="settings-range-input">
            <input data-target-id="settings-outline-offset" type="range" min="0" max="10" step="0.5" />
            <input data-target-id="settings-outline-offset-value" type="number" min="0" max="10" step="0.5" inputmode="decimal" />
          </div>
        </label>
        <label class="settings-field">
          <span>Corner radius</span>
          <div class="settings-range-input">
            <input data-target-id="settings-radius" type="range" min="0" max="16" step="1" />
            <input data-target-id="settings-radius-value" type="number" min="0" max="16" step="1" inputmode="decimal" />
          </div>
        </label>
        <label class="settings-field">
          <span>Glow</span>
          <div class="settings-range-input">
            <input data-target-id="settings-glow" type="range" min="0" max="8" step="0.5" />
            <input data-target-id="settings-glow-value" type="number" min="0" max="8" step="0.5" inputmode="decimal" />
          </div>
        </label>
        <label class="settings-field mod-checkbox">
          <input data-target-id="settings-auto-scroll" type="checkbox" />
          <span>Auto-scroll with playback</span>
        </label>
        <label class="settings-field mod-checkbox">
          <input data-target-id="settings-disable-shift-hide" type="checkbox" />
          <span>Disable Shift key for nekudot hiding</span>
        </label>
      </form>
    </aside>
    <aside class="admin-panel u-hidden" data-target-id="admin-panel">
      <div class="admin-panel-header">
        <strong>Admin Timing Mode</strong>
        <span data-target-id="admin-cue-count">0 Words</span>
      </div>
      <div class="admin-panel-status" data-target-id="admin-status">
        Select an aliyah and press play to start timing words.
      </div>
      <div class="admin-panel-actions">
        <button type="button" class="toolbar-button" data-target-id="admin-record">Record/Edit Timing</button>
        <button type="button" class="toolbar-button" data-target-id="admin-step-back">Step Back</button>
        <button type="button" class="toolbar-button" data-target-id="admin-undo">Undo Last</button>
        <button type="button" class="toolbar-button" data-target-id="admin-reset">Start Over</button>
        <button type="button" class="toolbar-button" data-target-id="admin-export">Export</button>
      </div>
    </aside>
    <div class="export-modal u-hidden" data-target-id="export-modal">
      <div class="export-card stack small">
        <div class="settings-pane-header">
          <h2>Export Timing</h2>
          <button class="toolbar-button" type="button" data-target-id="export-close">Close</button>
        </div>
        <div class="export-actions">
          <a class="toolbar-button" data-target-id="export-download" href="#">Download JSON</a>
        </div>
        <div class="export-target-path" data-target-id="export-target-path"></div>
        <div class="export-copy-status" data-target-id="export-copy-status"></div>
        <textarea data-target-id="export-text" spellcheck="false"></textarea>
      </div>
    </div>
    <audio data-target-id="reader-audio"></audio>
    <div id="debug" class="u-hidden">
    </div>
  </div>
  <script type="module" src="/src/index.ts"></script>
</body>

</html>
